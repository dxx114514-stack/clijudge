name: npm Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.2)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::no release tag (set input tag for manual runs)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prebuilds/windows prebuilds/linux dist
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'clijudge.exe' \
            --pattern 'clijudge-linux.bin' \
            --dir dist
          mv dist/clijudge.exe prebuilds/windows/clijudge.exe
          mv dist/clijudge-linux.bin prebuilds/linux/clijudge-linux.bin
          chmod +x prebuilds/linux/clijudge-linux.bin
          ls -l prebuilds/windows prebuilds/linux

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Sync package version with release tag
        run: npm pkg set version="${{ steps.meta.outputs.version }}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set - skipping npm publish"
            exit 0
          fi
          npm publish --access public --provenance
